<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Derp Party – Phone (Lobby)</title>
    <style>
      :root{
        --bg:#0b0b0d;--fg:#f6f6f7;--muted:#9aa0a6;--card:#16161a;--accent:#7dd3fc;
        --ok:#36d399;--warn:#fcd34d;--err:#f87171;--border:#27272a
      }
      *{box-sizing:border-box}
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--fg)}
      .wrap{padding:16px;max-width:640px;margin:0 auto}
      .row{display:flex;gap:8px;flex-wrap:wrap}
      .card{background:var(--card);border-radius:16px;padding:12px;border:1px solid var(--border)}
      #status{margin:12px 0 10px;padding:10px;border-radius:12px;background:#101014;border:1px solid #222}
      .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:#17171b;border:1px solid var(--border);font-size:12px;color:#c7cad1}
      .pill.ok{border-color:#1d3c2c;color:#a4f3bd}
      .pill.no{border-color:#3c1d1d;color:#f9bebe}
      .hidden{display:none!important}
      .btn-primary{border-color:#2563eb;background:#1e40af}
      .btn-accent{border-color:#155e75;background:#0e3a47}
      .btn-disabled{opacity:.6;pointer-events:none}

      /* Character grid */
      #charGrid{
        display:none;
        margin:12px 0;
        gap:18px 16px;
        grid-template-columns:repeat(3,minmax(0,1fr));
      }

      /* --- CHANGED: button is now transparent; no box around item --- */
      .charBtn{
        position:relative;
        display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;
        padding:0;                      /* was 10px */
        background:transparent;         /* REMOVE dark tile */
        border:0;                       /* REMOVE border */
        border-radius:0;                /* no rounding on container */
      }

      /* Portrait stands alone */
      .portrait{
        width:104px;height:104px;
        border-radius:14px;
        background:transparent;
        border:0;
        overflow:hidden;
        display:flex;align-items:center;justify-content:center;
      }
      .portrait img{
        width:100%;height:100%;
        object-fit:cover;
        display:block;
        border-radius:14px;
      }

      .portrait .fallback{ font-size:22px;color:#e5e7eb; }

      .charBtn .name{font-size:14px;color:#e5e7eb}

      /* --- CHANGED: apply selection outline to the image instead of the button --- */
      .charBtn.selected .portrait{ outline:2px solid var(--accent); outline-offset:2px }

      /* Keep the taken/disabled cues */
      .charBtn.taken{opacity:.45}
      .charBtn .badge{
        position:absolute;right:8px;top:8px;
        background:#111;border:1px solid var(--border);color:#ddd;font-size:11px;border-radius:10px;padding:2px 6px
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h3>Derp Party – Phone</h3>

      <div class="card" id="joinCard">
        <label>Room Code</label>
        <input id="room" placeholder="e.g. ABC123">
        <label>Name</label>
        <input id="name" placeholder="Your name" value="Player">
        <div class="row" style="margin-top:10px">
          <button id="btnJoin" class="btn-primary">Join Room</button>
        </div>
      </div>

      <div id="status" class="pill">Status: Waiting to join…</div>

      <div id="lobbyArea" class="card hidden">
        <div class="row" style="align-items:center;justify-content:space-between">
          <div class="pill">Pick a character, then tap “I’m Ready”.</div>
          <div id="readyPill" class="pill no">Not Ready</div>
        </div>

        <div id="charGrid"></div>

        <div class="row" style="margin-top:10px">
          <button id="btnReady" class="btn-accent btn-disabled" disabled>I’m Ready</button>
        </div>
      </div>

      <pre id="log" class="hidden"></pre>
      <div id="toast"></div>
    </div>

    <script>
      const WS_URL='wss://relay.derpparty.xyz/socket';
      const HTTP_BASE='https://relay.derpparty.xyz';
      let ws, playerId, roomId, hbInterval;
      let myReady=false, myCharId=null;
      const takenChars=new Set();
      const $=id=>document.getElementById(id);

      function log(x){const el=$('log');el.textContent+=x+"\n";el.scrollTop=el.scrollHeight;}
      function showToast(t,ms=1600){const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(showToast._to);showToast._to=setTimeout(()=>el.style.display='none',ms);}
      function setStatus(t,p=false){const el=$('status');el.textContent='Status: '+t;el.classList.toggle('pill',p);}
      function setLobbyVisible(on){$('lobbyArea').classList.toggle('hidden',!on);}
      function setReadyPill(on){const p=$('readyPill');p.textContent=on?'Ready':'Not Ready';p.classList.toggle('ok',on);p.classList.toggle('no',!on);}
      function enableReadyButton(can){const b=$('btnReady');b.disabled=!can;b.classList.toggle('btn-disabled',!can);}
      function ensureGridVisible(){const g=$('charGrid');g.style.display='grid';return g;}

      function renderCatalog(entries){
        const grid=$('charGrid');grid.innerHTML='';
        (entries||[]).forEach(e=>{
          const id=e.id, label=e.label||e.id;
          const url=e.portraitUrl||e.imageUrl||e.url||"";
          const data=e.portraitData||e.portrait||"";

          const btn=document.createElement('button');
          btn.className='charBtn'; btn.dataset.charId=id; btn.type='button';
          btn.onclick=()=>onCharClicked(id);

          const portrait=document.createElement('div'); portrait.className='portrait';
          const src=url||data;
          if(src){
            const img=document.createElement('img');
            img.loading='lazy'; img.decoding='async'; img.src=src;
            img.onerror=()=>{portrait.innerHTML='';const fb=document.createElement('div');fb.className='fallback';fb.textContent=label.slice(0,2).toUpperCase();portrait.appendChild(fb);};
            portrait.appendChild(img);
          }else{
            const fb=document.createElement('div');fb.className='fallback';fb.textContent=label.slice(0,2).toUpperCase();portrait.appendChild(fb);
          }

          const name=document.createElement('div'); name.className='name'; name.textContent=label;

          btn.appendChild(portrait);
          btn.appendChild(name);
          grid.appendChild(btn);
        });

        markTaken([]);
        markSelected(myCharId);
        enableReadyButton(!!myCharId);
        ensureGridVisible();
      }

      function markTaken(list){
        takenChars.clear(); (list||[]).forEach(id=>takenChars.add(String(id)));
        [...$('charGrid').querySelectorAll('.charBtn')].forEach(b=>{
          const id=b.dataset.charId; const isTaken=takenChars.has(id); const isMine=(id===myCharId);
          b.classList.toggle('taken', isTaken && !isMine);
          b.disabled=isTaken && !isMine;
        });
      }
      function markSelected(id){
        [...$('charGrid').querySelectorAll('.charBtn')].forEach(b=>{
          b.classList.toggle('selected', b.dataset.charId===id);
        });
      }

      function onCharClicked(id){
        if(!ws) return;
        if(takenChars.has(id) && id!==myCharId){showToast('That character is taken.');return;}
        ws.send(JSON.stringify({type:'CHARACTER_SELECT',charId:id,ts:Date.now()}));
        log('> CHARACTER_SELECT '+id);
        myCharId=id; markSelected(myCharId); enableReadyButton(true);
      }

      function applyCharacterPicked(pid, cid){
        if(pid===playerId){ myCharId=cid; showToast('Picked: '+cid); enableReadyButton(true); }
        takenChars.add(String(cid)); markTaken([...takenChars]); markSelected(myCharId);
      }

      function sendReady(){
        if(!ws) return; if(!myCharId){showToast('Pick a character first');return;}
        if(myReady) return; myReady=true; setReadyPill(true);
        ws.send(JSON.stringify({type:'PLAYER_READY',ts:Date.now()})); log('> PLAYER_READY');
      }

      $('btnJoin').onclick=async ()=>{
        roomId=$('room').value.trim().toUpperCase();
        const name=$('name').value.trim()||'Player';
        if(!roomId){alert('Enter room code.');return;}
        try{
          const resp=await fetch(`${HTTP_BASE}/rooms/${roomId}/join`,{method:'POST'});
          if(!resp.ok){log('Join HTTP failed: '+resp.status); setStatus('Join failed'); return;}
          const j=await resp.json(); playerId=j.playerId; log('Got playerId: '+playerId);
        }catch(e){log('HTTP error: '+e); setStatus('HTTP error'); return;}

        ws=new WebSocket(WS_URL);
        ws.onopen=()=>{
          log('WS open.');
          ws.send(JSON.stringify({type:'HELLO_PLAYER',roomId,playerId,name}));
          setStatus('Connected. In Lobby.', true);
          $('joinCard').classList.add('hidden'); setLobbyVisible(true);
          clearInterval(hbInterval);
          hbInterval=setInterval(()=>{try{ws.readyState===1&&ws.send(JSON.stringify({type:'PING'}));}catch(_){}},5000);
        };

        ws.onmessage=(ev)=>{
          log('< '+ev.data);
          try{
            const msg=JSON.parse(ev.data);
            if(msg.type==='PONG')return;
            if(msg.type!=='STATE')return;
            const s=msg.state||{};
            switch(s.type){
              case 'CHARACTER_CATALOG': renderCatalog(s.entries||[]); break;
              case 'LOBBY_STATE': {
                const players=s.players||[];
                const text=players.length?players.map(p=>`${p.name}${p.ready?' ✅':''}${p.charId?(' · '+p.charId):''}`).join(', '):'—';
                setStatus('Lobby: '+text, true);
                markTaken(s.taken||[]); break;
              }
              case 'CHARACTER_TAKEN': takenChars.add(String(s.charId)); markTaken([...takenChars]); break;
              case 'CHARACTER_PICKED': applyCharacterPicked(s.playerId,s.charId); break;
              case 'READY_OPEN': showToast('Ready phase open'); break;
              case 'READY_CLOSE': showToast('Ready closed'); break;
              case 'LOBBY_LOCKED': setStatus('Game starting…', true); setReadyPill(false); $('lobbyArea').classList.add('hidden'); break;
              case 'TEXT': showToast('📣 '+(s.message||'Info')); break;
            }
          }catch(e){console.error(e);}
        };

        ws.onclose=()=>{
          log('WS closed.'); setStatus('Disconnected'); setLobbyVisible(false); $('joinCard').classList.remove('hidden');
          clearInterval(hbInterval); myReady=false; myCharId=null; takenChars.clear(); $('charGrid').innerHTML='';
          enableReadyButton(false); setReadyPill(false);
        };
      };

      $('btnReady').onclick=sendReady;
    </script>
  </body>
</html>
