<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Derp Party – Phone</title>
    <style>
      body{font-family:system-ui,Arial,sans-serif;padding:16px}
      input,button{font-size:16px;margin:6px 0;padding:8px}
      #playArea button{min-width:56px}
      pre{background:#111;color:#0f0;padding:8px;height:220px;overflow:auto}
      label{display:block;margin-top:8px}
      #toast{
        position:fixed;left:50%;transform:translateX(-50%);bottom:24px;
        background:#222;color:#fff;padding:12px 16px;border-radius:10px;
        box-shadow:0 6px 18px rgba(0,0,0,.35);display:none;max-width:90%;text-align:center
      }
      .row{display:flex;gap:8px;flex-wrap:wrap}
      .row + .row{margin-top:10px}
      #status{margin:10px 0;padding:8px;border-radius:8px;background:#f2f2f7;font-size:14px}
      #playArea[disabled] {opacity:.5; pointer-events:none}
    </style>
  </head>
  <body>
    <h3>Derp Party – Phone</h3>

    <label>Room Code</label>
    <input id="room" placeholder="e.g. ABC123" style="width:100%">

    <label>Name</label>
    <input id="name" value="Player" style="width:100%">

    <button id="btnJoin">Join Room</button>
    <hr>

    <div id="status">Status: Waiting to join…</div>

    <div id="playArea" disabled style="display:none">
      <div class="row">
        <button id="btnReady" onclick="sendReady()">I'm Ready</button>
      </div>

      <div class="row">
        <button onclick="sendAnswer('A')">A</button>
        <button onclick="sendAnswer('B')">B</button>
        <button onclick="sendAnswer('C')">C</button>
        <button onclick="sendAnswer('D')">D</button>
      </div>

      <div class="row">
        <button onclick="sendCard('Block')">Play Block</button>
        <button onclick="sendCard('Steal')">Play Steal</button>
        <button onclick="sendCard('Scramble')">Play Scramble</button>
      </div>
    </div>

    <pre id="log"></pre>
    <div id="toast"></div>

    <script>
      // --- Defaults: edit here if you deploy elsewhere ---
      const WS_URL = 'wss://relay.derpparty.xyz/socket';
      const HTTP_BASE = 'https://relay.derpparty.xyz';

      let ws, playerId, roomId, hbInterval;
      const $ = (id)=>document.getElementById(id);

      function setStatus(text){ $('status').textContent = 'Status: ' + text; }
      function setPlayEnabled(on){
        const pe = $('playArea');
        if (!pe) return;
        pe.style.display = on ? 'block' : 'none';
        if (on) pe.removeAttribute('disabled'); else pe.setAttribute('disabled','');
      }

      function log(x){
        const el=$('log'); el.textContent += x + "\n"; el.scrollTop = el.scrollHeight;
      }
      function showToast(text, ms=1800){
        const t=$('toast');
        t.textContent = text;
        t.style.display='block';
        clearTimeout(showToast._to);
        showToast._to = setTimeout(()=> t.style.display='none', ms);
      }

      $('btnJoin').onclick = async () => {
        roomId = $('room').value.trim().toUpperCase();
        const name = $('name').value.trim() || 'Player';
        if(!roomId){ alert('Enter room code.'); return; }

        try{
          const resp = await fetch(`${HTTP_BASE}/rooms/${roomId}/join`, { method:'POST' });
          if(!resp.ok){ log('Join HTTP failed: ' + resp.status); setStatus('Join failed'); return; }
          const j = await resp.json();
          playerId = j.playerId;
          log('Got playerId: ' + playerId);
        }catch(e){ log('HTTP error: ' + e); setStatus('HTTP error'); return; }

        ws = new WebSocket(WS_URL);
        ws.onopen = () => {
          log('WS open.');
          setStatus('Connected. In Lobby.');
          ws.send(JSON.stringify({ type:'HELLO_PLAYER', roomId, playerId, name }));
          setPlayEnabled(true);
          clearInterval(hbInterval);
          hbInterval = setInterval(()=> {
            try { ws.readyState===1 && ws.send(JSON.stringify({ type:'PING' })); } catch(_) {}
          }, 5000);
        };
        ws.onmessage = (ev) => {
          log('< ' + ev.data);
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type !== 'STATE') return; // host tunnels everything via STATE
            const s = msg.state || {};
            switch(s.type){
              // --- Round-0 flow types ---
              case 'LOBBY_STATE':
                setStatus('Lobby: ' + ((s.players||[]).map(p => `${p.name}${p.ready?' ✅':''}`).join(', ') || '—'));
                break;

              case 'READY_OPEN':
                setStatus('Ready phase open.');
                showToast('✋ Ready up!', 2000);
                break;
              case 'READY_CLOSE':
                setStatus('Ready closed.');
                break;

              case 'COUNTDOWN':
                setStatus(s.secondsLeft>0 ? `Starting in ${s.secondsLeft}…` : 'Go!');
                break;

              case 'SCOREBOARD':
                setStatus('Scoreboard shown.');
                renderScoreboard(s.rows||[]);
                break;

              // --- Windows ---
              case 'ANSWER_WINDOW_OPEN':
                setStatus(`Answer window open (${s.deadlineMs||0} ms)`);
                showToast('✅ Answer window OPEN');
                break;
              case 'ANSWER_WINDOW_CLOSE':
                setStatus('Answer window closed.');
                showToast('⛔ Answer window CLOSED', 1200);
                break;

              case 'TRICK_WINDOW_OPEN': {
                let types = [];
                try { types = JSON.parse(s.typesAllowedJson || '[]'); } catch {}
                setStatus(`Trick window open (${s.deadlineMs||0} ms) [${types.join(', ')}]`);
                showToast('🎭 Trick window OPEN', 1800);
                break;
              }
              case 'TRICK_WINDOW_CLOSE':
                setStatus('Trick window closed.');
                showToast('🪄 Trick window CLOSED', 1200);
                break;

              case 'CARD_ACK':
                if (s.playerId === playerId) showToast('✅ Your ' + s.cardType + ' locked in!');
                break;
              case 'CARD_REJECT':
                if (s.playerId === playerId) showToast('❌ ' + (s.cardType||'Card') + ' rejected (' + (s.reason||'') + ')', 2000);
                break;

              case 'RESOLVE_RESULT': {
                const applied = (s.applied||[]).map(a => (a.cardType + ' by ' + a.playerId)).join(', ');
                const skipped = (s.skipped||[]).map(a => (a.cardType + ' by ' + a.playerId + ' ('+a.reason+')')).join(', ');
                const parts = [];
                if (applied) parts.push('✓ ' + applied);
                if (skipped) parts.push('⨯ ' + skipped);
                if (s.cancelled) parts.push('🚫 Cancelled');
                if (s.newOwnerId) parts.push('👑 Owner: ' + s.newOwnerId);
                if (s.scrambled) parts.push('🔀 Scramble');
                showToast(parts.join(' | ') || 'Resolved', 2500);
                break;
              }
            }
          } catch(_) {}
        };
        ws.onclose = () => {
          log('WS closed.');
          setStatus('Disconnected');
          setPlayEnabled(false);
          clearInterval(hbInterval);
        };
      };

      function sendReady(){
        if(!ws) return;
        ws.send(JSON.stringify({ type:'PLAYER_READY', ts: Date.now() }));
        log('> PLAYER_READY');
      }
      function sendAnswer(opt){
        if(!ws) return;
        ws.send(JSON.stringify({ type:'ANSWER_SUBMIT', option: opt, ts: Date.now() }));
        log('> ANSWER_SUBMIT ' + opt);
      }
      function sendCard(kind){
        if(!ws) return;
        ws.send(JSON.stringify({ type:'CARD_INTENT', cardId: kind, ts: Date.now() }));
        log('> CARD_INTENT ' + kind);
      }

      function renderScoreboard(rows){
        let s = '🏆 Scoreboard\n';
        (rows||[]).forEach((r,i)=> { s += `${i+1}. ${r.name} — ${r.coins}\n`; });
        alert(s); // ultra-simple for now
      }
    </script>
  </body>
</html>
