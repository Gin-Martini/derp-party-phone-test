<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Phone Test</title>
    <style>
      body{font-family:system-ui,Arial,sans-serif;padding:16px}
      input,button{font-size:16px;margin:6px 0;padding:8px}
      #playArea button{min-width:56px}
      pre{background:#111;color:#0f0;padding:8px;height:220px;overflow:auto}
      label{display:block;margin-top:8px}
      #toast{
        position:fixed;left:50%;transform:translateX(-50%);bottom:24px;
        background:#222;color:#fff;padding:12px 16px;border-radius:10px;
        box-shadow:0 6px 18px rgba(0,0,0,.35);display:none;max-width:90%;text-align:center
      }
      .row{display:flex;gap:8px;flex-wrap:wrap}
      .row + .row{margin-top:10px}
    </style>
  </head>
  <body>
    <h3>Phone Test</h3>

    <label>Relay WS URL</label>
    <input id="wsurl" value="wss://relay.derpparty.xyz/socket" style="width:100%">

    <label>HTTP Base</label>
    <input id="httpbase" value="https://relay.derpparty.xyz" style="width:100%">

    <label>Room Code</label>
    <input id="room" placeholder="e.g. ABC123" style="width:100%">

    <label>Name</label>
    <input id="name" value="Player" style="width:100%">

    <button id="btnJoin">Join Room</button>
    <hr>

    <div id="playArea" style="display:none">
      <div class="row">
        <button onclick="sendAnswer('A')">A</button>
        <button onclick="sendAnswer('B')">B</button>
        <button onclick="sendAnswer('C')">C</button>
        <button onclick="sendAnswer('D')">D</button>
      </div>
      <div class="row">
        <button onclick="sendCard('Block')">Play Block</button>
        <button onclick="sendCard('Steal')">Play Steal</button>
        <button onclick="sendCard('Scramble')">Play Scramble</button>
      </div>
    </div>

    <pre id="log"></pre>
    <div id="toast"></div>

    <script>
      let ws, playerId, roomId;

      function log(x){
        const el=document.getElementById('log');
        el.textContent += x + "\n";
        el.scrollTop = el.scrollHeight;
      }
      function showToast(text, ms=1800){
        const t=document.getElementById('toast');
        t.textContent = text;
        t.style.display='block';
        clearTimeout(showToast._to);
        showToast._to = setTimeout(()=> t.style.display='none', ms);
      }

      document.getElementById('btnJoin').onclick = async () => {
        const wsurl = document.getElementById('wsurl').value.trim();
        const httpbase = document.getElementById('httpbase').value.trim();
        roomId = document.getElementById('room').value.trim().toUpperCase();
        const name = document.getElementById('name').value.trim() || 'Player';
        if(!roomId){ alert('Enter room code.'); return; }

        try{
          const resp = await fetch(`${httpbase}/rooms/${roomId}/join`, { method:'POST' });
          if(!resp.ok){ log('Join HTTP failed: ' + resp.status); return; }
          const j = await resp.json();
          playerId = j.playerId;
          log('Got playerId: ' + playerId);
        }catch(e){ log('HTTP error: ' + e); return; }

        ws = new WebSocket(wsurl);
        ws.onopen = () => {
          log('WS open.');
          ws.send(JSON.stringify({ type:'HELLO_PLAYER', roomId, playerId, name }));
          document.getElementById('playArea').style.display = 'block';
          setInterval(()=> {
            try { ws.readyState===1 && ws.send(JSON.stringify({ type:'PING' })); } catch(_) {}
          }, 5000);
        };
        ws.onmessage = (ev) => {
          log('< ' + ev.data);
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type !== 'STATE') return; // host tunnels everything via STATE
            const s = msg.state || {};
            switch(s.type){
              case 'TEXT':
                showToast('📣 ' + (s.message || 'State'));
                break;

              case 'ANSWER_WINDOW_OPEN':
                showToast('✅ Answer window OPEN (' + (s.deadlineMs||0) + ' ms)');
                break;
              case 'ANSWER_WINDOW_CLOSE':
                showToast('⛔ Answer window CLOSED', 1200);
                break;

              case 'TRICK_WINDOW_OPEN': {
                let types = [];
                try { types = JSON.parse(s.typesAllowedJson || '[]'); } catch {}
                showToast('🎭 Trick window OPEN (' + (s.deadlineMs||0) + ' ms) ' + (types.length?('['+types.join(', ')+']'):'[]'), 2000);
                break;
              }
              case 'TRICK_WINDOW_CLOSE':
                showToast('🪄 Trick window CLOSED', 1200);
                break;

              case 'CARD_ACK':
                if (s.playerId === playerId)
                  showToast('✅ Your ' + s.cardType + ' locked in!');
                break;
              case 'CARD_REJECT':
                if (s.playerId === playerId)
                  showToast('❌ ' + (s.cardType||'Card') + ' rejected (' + (s.reason||'') + ')', 2000);
                break;

              case 'RESOLVE_RESULT': {
                const applied = (s.applied||[]).map(a => (a.cardType + ' by ' + a.playerId)).join(', ');
                const skipped = (s.skipped||[]).map(a => (a.cardType + ' by ' + a.playerId + ' ('+a.reason+')')).join(', ');
                const parts = [];
                if (applied) parts.push('✓ ' + applied);
                if (skipped) parts.push('⨯ ' + skipped);
                if (s.cancelled) parts.push('🚫 Cancelled');
                if (s.newOwnerId) parts.push('👑 Owner: ' + s.newOwnerId);
                if (s.scrambled) parts.push('🔀 Scramble');
                showToast(parts.join(' | ') || 'Resolved', 2500);
                break;
              }
            }
          } catch(_) {}
        };
        ws.onclose = () => { log('WS closed.'); showToast('Disconnected', 1200); };
      };

      function sendAnswer(opt){
        if(!ws) return;
        ws.send(JSON.stringify({ type:'ANSWER_SUBMIT', option: opt, ts: Date.now() }));
        log('> ANSWER_SUBMIT ' + opt);
      }

      function sendCard(kind){
        if(!ws) return;
        ws.send(JSON.stringify({ type:'CARD_INTENT', cardId: kind, ts: Date.now() }));
        log('> CARD_INTENT ' + kind);
      }
    </script>
  </body>
</html>
