<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Derp Party – Phone (Lobby)</title>
    <style>
      :root{
        --bg:#0b0b0d;--fg:#f6f6f7;--muted:#9aa0a6;--card:#16161a;--accent:#7dd3fc;
        --ok:#36d399;--warn:#fcd34d;--err:#f87171;--border:#27272a
      }
      *{box-sizing:border-box}
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--fg)}
      .wrap{padding:16px;max-width:640px;margin:0 auto}
      h3{margin:10px 0 8px}
      label{display:block;margin:10px 0 6px;color:var(--muted);font-size:14px}
      input,button{font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--border);background:#111115;color:var(--fg)}
      input{width:100%}
      .row{display:flex;gap:8px;flex-wrap:wrap}
      .row + .row{margin-top:10px}
      .card{background:var(--card);border-radius:16px;padding:12px;border:1px solid var(--border)}
      #status{margin:12px 0 10px;padding:10px;border-radius:12px;background:#101014;border:1px solid #222;text-wrap:balance}
      #log{background:#0d0d10;color:#9ee5b2;padding:8px;height:160px;overflow:auto;border-radius:12px;border:1px solid #232326}
      #toast{
        position:fixed;left:50%;transform:translateX(-50%);bottom:24px;
        background:#222;color:#fff;padding:12px 16px;border-radius:12px;
        box-shadow:0 8px 24px rgba(0,0,0,.45);display:none;max-width:90%;text-align:center;z-index:9999
      }
      .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:#17171b;border:1px solid var(--border);font-size:12px;color:#c7cad1}
      .pill.ok{border-color:#1d3c2c;color:#a4f3bd}
      .pill.no{border-color:#3c1d1d;color:#f9bebe}
      .hidden{display:none!important}
      .btn-primary{border-color:#2563eb;background:#1e40af}
      .btn-accent{border-color:#155e75;background:#0e3a47}
      .btn-disabled{opacity:.6;pointer-events:none}

      /* Character grid */
      #charGrid{display:none;margin:12px 0;gap:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
      .charBtn{
        position:relative;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
        padding:10px;border-radius:14px;background:#0f0f13;border:1px solid var(--border)
      }
      .portrait{
        width:88px;height:88px;border-radius:14px;background:#0c0c10;
        display:flex;align-items:center;justify-content:center;
        border:1px solid #2a2a2f;overflow:hidden;
      }
      .portrait img{ width:100%;height:100%;object-fit:cover;display:block; }
      .portrait .fallback{ font-size:22px;color:#e5e7eb; }
      .charBtn .name{font-size:14px;color:#e5e7eb}
      .charBtn.taken{opacity:.4;border-style:dashed}
      .charBtn.selected{outline:2px solid var(--accent);outline-offset:2px}
      .charBtn .badge{
        position:absolute;right:8px;top:8px;
        background:#111;border:1px solid var(--border);color:#ddd;font-size:11px;border-radius:10px;padding:2px 6px
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h3>Derp Party – Phone</h3>

      <div class="card" id="joinCard">
        <label>Room Code</label>
        <input id="room" placeholder="e.g. ABC123">

        <label>Name</label>
        <input id="name" placeholder="Your name" value="Player">

        <div class="row" style="margin-top:10px">
          <button id="btnJoin" class="btn-primary">Join Room</button>
        </div>
      </div>

      <div id="status" class="pill">Status: Waiting to join…</div>

      <div id="lobbyArea" class="card hidden">
        <div class="row" style="align-items:center;justify-content:space-between">
          <div class="pill">Pick a character, then tap “I’m Ready”.</div>
          <div id="readyPill" class="pill no">Not Ready</div>
        </div>

        <div id="charGrid"></div>

        <div class="row" style="margin-top:10px">
          <button id="btnReady" class="btn-accent btn-disabled" disabled>I’m Ready</button>
        </div>
      </div>

      <pre id="log" class="hidden"></pre>
      <div id="toast"></div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const DEFAULT_BASE = 'https://derpparty-relay.fly.dev';
      const STORAGE_KEY = 'derp-party-phone-state';

      function loadStoredState(){
        if (typeof localStorage === 'undefined') return {};
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return {};
          const parsed = JSON.parse(raw);
          return (parsed && typeof parsed === 'object') ? parsed : {};
        } catch (err) {
          console.warn('Failed to load stored state', err);
          return {};
        }
      }

      function persistState(state){
        if (typeof localStorage === 'undefined') return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          console.warn('Failed to persist state', err);
        }
      }

      const storedState = loadStoredState();
      if (!storedState.rooms || typeof storedState.rooms !== 'object') storedState.rooms = {};

      function ensureProtocol(url, prefer){
        const cleaned = (url || '').trim();
        if (!cleaned) return `${prefer}://`;
        if (/^https?:/i.test(cleaned) || /^wss?:/i.test(cleaned)) return cleaned;
        return `${prefer}://${cleaned}`;
      }

      const rawRelay = (params.get('relay') || DEFAULT_BASE).trim().replace(/\/+$/, '');
      const httpBaseCandidate = ensureProtocol(rawRelay, 'https');
      const wsBaseCandidate   = ensureProtocol(rawRelay, 'wss');
      const HTTP_BASE = (httpBaseCandidate.startsWith('http') ? httpBaseCandidate : httpBaseCandidate.replace(/^ws/i, 'http')).replace(/\/+$/, '');
      const WS_BASE   = (wsBaseCandidate.startsWith('ws') ? wsBaseCandidate : wsBaseCandidate.replace(/^http/i, 'ws')).replace(/\/+$/, '');
      const WS_URL    = `${WS_BASE}/socket`;

      function createLocalPlayerId(){
        if (window.crypto && typeof window.crypto.randomUUID === 'function'){
          return `p-${window.crypto.randomUUID()}`;
        }
        return `p-${Math.random().toString(36).slice(2,10)}`;
      }

      function buildWsUrl(room, player){
        try {
          const url = new URL(WS_URL);
          url.searchParams.set('room', room);
          url.searchParams.set('role', 'player');
          if (player) url.searchParams.set('playerId', player);
          return url.toString();
        } catch (err) {
          console.warn('Falling back to manual WS url build', err);
          let query = `room=${encodeURIComponent(room)}&role=player`;
          if (player) query += `&playerId=${encodeURIComponent(player)}`;
          return `${WS_URL}?${query}`;
        }
      }

      let ws, playerId, roomId, hbInterval;
      let playerName = '';
      let playerToken = '';
      let myReady = false;
      let myCharId = null;
      let knownCatalog = [];
      const takenChars = new Set();

      const $ = (id)=>document.getElementById(id);

      function log(x){ const el=$('log'); el.textContent += x + "\n"; el.scrollTop = el.scrollHeight; }
      function showToast(text, ms=1600){ const t=$('toast'); t.textContent=text; t.style.display='block'; clearTimeout(showToast._to); showToast._to=setTimeout(()=>t.style.display='none',ms); }
      function setStatus(text, pill=false){ const el=$('status'); el.textContent='Status: '+text; if(pill){el.classList.add('pill')}else{el.classList.remove('pill')} }
      function setLobbyVisible(on){ $('lobbyArea').classList.toggle('hidden', !on); }
      function setReadyPill(on){ const p=$('readyPill'); p.textContent=on?'Ready':'Not Ready'; p.classList.toggle('ok',on); p.classList.toggle('no',!on); }
      function enableReadyButton(can){ const b=$('btnReady'); b.disabled=!can; b.classList.toggle('btn-disabled',!can); }
      function refreshReadyUI(){ setReadyPill(myReady); enableReadyButton(!!myCharId && !myReady); }

      function ensureGridVisible(){ const grid=$('charGrid'); grid.style.display='grid'; return grid; }

      function renderCatalog(entries){
        knownCatalog = entries || [];
        const grid = $('charGrid');
        grid.innerHTML = '';

        knownCatalog.forEach(e=>{
          const id    = e.id;
          const label = e.label || e.id;
          const url   = e.portraitUrl || e.imageUrl || e.url || "";
          const data  = e.portraitData || e.portrait || "";

          const btn = document.createElement('button');
          btn.className = 'charBtn';
          btn.dataset.charId = id;
          btn.type = 'button';
          btn.onclick = () => onCharClicked(id);

          const portrait = document.createElement('div');
          portrait.className = 'portrait';

          const src = url || data;
          if (src){
            const img = document.createElement('img');
            img.loading = 'lazy';
            img.decoding = 'async';
            img.src = src;
            img.onerror = () => {
              portrait.innerHTML='';
              const fb=document.createElement('div'); fb.className='fallback'; fb.textContent=label.slice(0,2).toUpperCase();
              portrait.appendChild(fb);
            };
            portrait.appendChild(img);
          } else {
            const fb=document.createElement('div'); fb.className='fallback'; fb.textContent=label.slice(0,2).toUpperCase();
            portrait.appendChild(fb);
          }

          const name = document.createElement('div');
          name.className = 'name';
          name.textContent = label;

          btn.appendChild(portrait);
          btn.appendChild(name);
          grid.appendChild(btn);
        });

        markTaken([...takenChars]);
        markSelected(myCharId);
        refreshReadyUI();
        ensureGridVisible();
      }

      function markTaken(list){
        takenChars.clear();
        (list||[]).forEach(id => takenChars.add(String(id)));

        const grid = $('charGrid');
        [...grid.querySelectorAll('.charBtn')].forEach(b=>{
          const id = b.dataset.charId;
          const isTaken = takenChars.has(id);
          const isMine  = (id === myCharId);
          b.classList.toggle('taken', isTaken && !isMine);
          b.disabled = isTaken && !isMine;
        });
      }

      function markSelected(id){
        const grid = $('charGrid');
        [...grid.querySelectorAll('.charBtn')].forEach(b=>{
          b.classList.toggle('selected', b.dataset.charId === id);
        });
      }

      function onCharClicked(id){
        if (!ws) return;
        if (takenChars.has(id) && id !== myCharId){ showToast('That character is taken.'); return; }
        ws.send(JSON.stringify({ type:'CHARACTER_SELECT', charId:id, ts: Date.now() }));
        log('> CHARACTER_SELECT ' + id);
        myCharId = id;
        myReady = false;
        markSelected(myCharId);
        refreshReadyUI();
      }

      function applyCharacterPicked(playerIdPicked, charIdPicked){
        if (playerIdPicked === playerId){
          myCharId = charIdPicked;
          showToast('Picked: ' + charIdPicked);
        }
        takenChars.add(String(charIdPicked));
        markTaken([...takenChars]);
        markSelected(myCharId);
        refreshReadyUI();
      }

      function sendReady(){
        if(!ws) return;
        if (!myCharId){ showToast('Pick a character first'); return; }
        if (myReady) return;
        myReady = true;
        ws.send(JSON.stringify({ type:'PLAYER_READY', ts: Date.now() }));
        log('> PLAYER_READY');
        refreshReadyUI();
      }

      function syncLobbyState(state){
        const players = state.players || [];
        const text = players.length
          ? players.map(p => `${p.name}${p.ready?' ✅':''}${p.charId?(' · '+p.charId):''}`).join(', ')
          : '—';
        setStatus('Lobby: ' + text, true);

        const derivedTaken = new Set(state.taken || []);
        players.forEach(p => { if (p && p.charId) derivedTaken.add(String(p.charId)); });
        markTaken([...derivedTaken]);

        const me = players.find(p => p && (p.playerId === playerId || (!p.playerId && p.name && p.name === playerName)));
        if (me){
          if (me.charId) myCharId = String(me.charId);
          myReady = !!me.ready;
        }

        markSelected(myCharId);
        refreshReadyUI();
      }

      const initialRoom = $('room');
      const initialName = $('name');

      const prefillRoom = (params.get('room') || '').trim();
      if (prefillRoom) initialRoom.value = prefillRoom.toUpperCase();

      if (storedState && storedState._lastName && !initialName.value){
        initialName.value = storedState._lastName;
      }

      $('btnJoin').onclick = async () => {
        roomId = initialRoom.value.trim().toUpperCase();
        const nameInput = initialName.value.trim();
        const name = nameInput || storedState?._lastName || 'Player';
        playerName = name;
        playerId = null;
        playerToken = '';
        if(!roomId){ alert('Enter room code.'); return; }

        if (ws && ws.readyState < WebSocket.CLOSED){
          try { ws.close(1000, 'rejoin'); } catch(_) {}
        }
        ws = null;

        setStatus('Joining room…');
        log(`Join POST ${HTTP_BASE}/rooms/${roomId}/join`);

        let wsFromServer = '';

        let joinAttempted = false;
        let joinFailedResponse = false;
        const storedForRoom = (storedState && storedState.rooms && storedState.rooms[roomId]) || null;

        try{
          const resp = await fetch(`${HTTP_BASE}/rooms/${roomId}/join`, {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ name }),
            mode:'cors',
          });
          joinAttempted = true;
          if(!resp.ok){
            joinFailedResponse = true;
            const text = await resp.text().catch(()=> '');
            log('Join HTTP failed: ' + resp.status + (text ? (' ' + text) : ''));
            setStatus(`Join failed (${resp.status})`);
            return;
          }
          const j = await resp.json().catch(err => {
            log('Join JSON parse failed: ' + err);
            return null;
          });
          if (!j || !j.playerId){
            log('Join response missing playerId. Body=' + JSON.stringify(j));
            setStatus('Join failed (bad response)');
            return;
          }
          playerId = j.playerId;
          playerToken = j.token || '';
          log('Got playerId: ' + playerId);
          wsFromServer = j.socketUrl || j.wsUrl || '';
          if (wsFromServer){
            try {
              const direct = new URL(wsFromServer, WS_BASE + '/');
              if (!direct.searchParams.has('room')) direct.searchParams.set('room', roomId);
              if (!direct.searchParams.has('role')) direct.searchParams.set('role', 'player');
              if (!direct.searchParams.has('playerId')) direct.searchParams.set('playerId', playerId);
              wsFromServer = direct.toString();
            } catch(err){
              log('Failed to use socketUrl from server: ' + err);
              wsFromServer = '';
            }
          }
        }catch(e){
          log('Join HTTP error: ' + e);
          if (joinFailedResponse) return;
          const fallbackId = storedForRoom && storedForRoom.playerId
            ? storedForRoom.playerId
            : createLocalPlayerId();
          playerId = fallbackId;
          playerToken = (storedForRoom && storedForRoom.token) || '';
          setStatus('Relay HTTP unavailable, trying direct connect…');
        }

        if (!playerId){
          if (storedForRoom && storedForRoom.playerId){
            playerId = storedForRoom.playerId;
            playerToken = storedForRoom.token || '';
          } else if (!joinAttempted){
            const generated = createLocalPlayerId();
            playerId = generated;
            playerToken = '';
          }
        }

        if (!playerId){
          setStatus('Join failed (no player id)');
          return;
        }

        storedState._lastName = name;
        storedState.rooms = storedState.rooms || {};
        storedState.rooms[roomId] = { playerId, token: playerToken, name };
        persistState(storedState);

        const wsUrl = (typeof wsFromServer === 'string' && wsFromServer) ? wsFromServer : buildWsUrl(roomId, playerId);
        log('WS connect -> ' + wsUrl);
        ws = new WebSocket(wsUrl);
        ws.onopen = () => {
          log('WS open.');
          ws.send(JSON.stringify({ type:'HELLO_PLAYER', roomId, playerId, name }));
          const identifyPayload = {
            name,
            role: 'player'
          };
          if (playerToken) identifyPayload.token = playerToken;
          ws.send(JSON.stringify({
            type: 'IDENTIFY',
            roomId,
            playerId,
            senderId: playerId,
            role: 'player',
            payload: identifyPayload
          }));
          setStatus('Connected. In Lobby.', true);
          $('joinCard').classList.add('hidden');
          setLobbyVisible(true);
          clearInterval(hbInterval);
          hbInterval = setInterval(()=> { try { ws.readyState===1 && ws.send(JSON.stringify({ type:'PING' })); } catch(_) {} }, 5000);
        };

        ws.onmessage = (ev) => {
          log('< ' + ev.data);
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'PONG') return;
            if (msg.type !== 'STATE') return;

            const s = msg.state || {};
            switch(s.type){
              case 'CHARACTER_CATALOG':
                renderCatalog(s.entries||[]);
                break;

              case 'LOBBY_STATE': {
                syncLobbyState(s);
                break;
              }

              case 'CHARACTER_TAKEN':
                takenChars.add(String(s.charId));
                markTaken([...takenChars]);
                break;

              case 'CHARACTER_PICKED':
                applyCharacterPicked(s.playerId, s.charId);
                break;

              case 'CHARACTER_RELEASED':
                takenChars.delete(String(s.charId));
                markTaken([...takenChars]);
                refreshReadyUI();
                break;

              case 'PLAYER_READY':
                if (s.playerId === playerId){ myReady = true; refreshReadyUI(); }
                break;

              case 'PLAYER_UNREADY':
              case 'PLAYER_READY_CANCELLED':
                if (s.playerId === playerId){ myReady = false; refreshReadyUI(); }
                break;

              case 'READY_OPEN':  showToast('Ready phase open'); break;
              case 'READY_CLOSE': showToast('Ready closed'); break;

              case 'LOBBY_LOCKED':
                setStatus('Game starting…', true);
                setReadyPill(false);
                $('lobbyArea').classList.add('hidden');
                break;

              case 'TEXT':
                showToast('📣 ' + (s.message || 'Info'));
                break;
            }
          } catch(e) { console.error(e); }
        };

        ws.onclose = () => {
          log('WS closed.');
          setStatus('Disconnected');
          setLobbyVisible(false);
          $('joinCard').classList.remove('hidden');
          clearInterval(hbInterval);
          myReady = false; myCharId = null; takenChars.clear(); knownCatalog = [];
          $('charGrid').innerHTML = '';
          refreshReadyUI();
        };
      };

      $('btnReady').onclick = sendReady;
    </script>
  </body>
</html>
