<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Derp Party – Phone (Lobby)</title>
    <style>
      :root{--bg:#0b0b0d;--fg:#f6f6f7;--muted:#9aa0a6;--card:#16161a;--accent:#7dd3fc}
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--fg)}
      .wrap{padding:16px;max-width:640px;margin:0 auto}
      h3{margin:10px 0 8px}
      label{display:block;margin:10px 0 6px;color:var(--muted);font-size:14px}
      input,button{font-size:16px;padding:10px;border-radius:10px;border:1px solid #2a2a2f;background:#111115;color:var(--fg)}
      input{width:100%}
      .row{display:flex;gap:8px;flex-wrap:wrap}
      .row + .row{margin-top:10px}
      .card{background:var(--card);border-radius:14px;padding:12px;border:1px solid #27272a}
      #status{margin:12px 0 10px;padding:10px;border-radius:10px;background:#101014;border:1px solid #222;text-wrap:balance}
      #log{background:#0d0d10;color:#9ee5b2;padding:8px;height:160px;overflow:auto;border-radius:10px;border:1px solid #232326}
      #toast{
        position:fixed;left:50%;transform:translateX(-50%);bottom:24px;
        background:#222;color:#fff;padding:12px 16px;border-radius:12px;
        box-shadow:0 8px 24px rgba(0,0,0,.45);display:none;max-width:90%;text-align:center;z-index:9999
      }
      #playArea[disabled]{opacity:.6;pointer-events:none}
      #charGrid{display:none;margin:10px 0;gap:10px;
        display:grid;grid-template-columns:repeat(4, minmax(0, 1fr))}
      #charGrid button{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:28px}
      #charGrid button.taken{opacity:.4;border-style:dashed}
      .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#17171b;border:1px solid #2a2a2f;font-size:12px;color:#c7cad1}
      .pill.green{border-color:#2e7d32;color:#9be49e}
      .pill.red{border-color:#8b2e2e;color:#f0aaaa}
      .spacer{height:8px}
      .hidden{display:none !important}
      .btn-primary{border-color:#2563eb;background:#1e40af}
      .btn-accent{border-color:#155e75;background:#0e3a47}
    </style>
  </head>
  <body>
    <div class="wrap">
      <h3>Derp Party – Phone</h3>

      <div class="card">
        <label>Room Code</label>
        <input id="room" placeholder="e.g. ABC123">

        <label>Name</label>
        <input id="name" placeholder="Your name" value="Player">

        <div class="row" style="margin-top:10px">
          <button id="btnJoin" class="btn-primary">Join Room</button>
        </div>
      </div>

      <div id="status" class="pill">Status: Waiting to join…</div>

      <div id="lobbyArea" class="card hidden">
        <div class="row" style="align-items:center;justify-content:space-between">
          <div class="pill">Pick a character, then tap “I’m Ready”.</div>
          <div id="readyPill" class="pill red">Not Ready</div>
        </div>

        <div id="charGrid"></div>

        <div class="row" style="margin-top:10px">
          <button id="btnReady" class="btn-accent">I’m Ready</button>
        </div>
      </div>

      <div class="spacer"></div>
      <pre id="log"></pre>
      <div id="toast"></div>
    </div>

    <script>
      // --- Config (adjust if needed) ---
      const WS_URL    = 'wss://relay.derpparty.xyz/socket';
      const HTTP_BASE = 'https://relay.derpparty.xyz';

      // --- State ---
      let ws, playerId, roomId, hbInterval;
      let myReady = false;
      let myCharId = null;

      const $ = (id)=>document.getElementById(id);

      // --- UI utils ---
      function log(x){ const el=$('log'); el.textContent += x + "\n"; el.scrollTop = el.scrollHeight; }
      function showToast(text, ms=1600){
        const t=$('toast'); t.textContent = text; t.style.display='block';
        clearTimeout(showToast._to); showToast._to = setTimeout(()=> t.style.display='none', ms);
      }
      function setStatus(text, pill=false){
        const el=$('status'); el.textContent = 'Status: ' + text;
        if (pill){ el.classList.add('pill'); } else { el.classList.remove('pill'); }
      }
      function setLobbyVisible(on){
        $('lobbyArea').classList.toggle('hidden', !on);
      }
      function setReadyPill(on){
        const p=$('readyPill');
        p.textContent = on ? 'Ready' : 'Not Ready';
        p.classList.toggle('green', on);
        p.classList.toggle('red', !on);
      }

      // --- Character Grid ---
      const takenChars = new Set();

      function ensureGrid(){
        const grid = $('charGrid');
        if (!grid.dataset.built) {
          // built on first catalog message
          grid.dataset.built = '1';
        }
        return grid;
      }

      function renderCatalog(entries){
        const grid = $('charGrid');
        grid.innerHTML = '';
        (entries||[]).forEach(e=>{
          const btn = document.createElement('button');
          btn.textContent = e.label || e.id;
          btn.title = e.id;
          btn.dataset.charId = e.id;
          btn.onclick = () => sendCharSelect(e.id);
          grid.appendChild(btn);
        });
        grid.style.display = 'grid';
        markTaken([...takenChars]); // apply any known taken state
      }

      function markTaken(list){
        takenChars.clear();
        (list||[]).forEach(id => takenChars.add(id));
        const grid = $('charGrid');
        [...grid.querySelectorAll('button')].forEach(b=>{
          const id = b.dataset.charId;
          const isTaken = takenChars.has(id);
          b.disabled = isTaken && id !== myCharId; // allow re-click on your own choice
          b.classList.toggle('taken', isTaken && id !== myCharId);
          // highlight my own pick a bit
          if (id === myCharId){ b.style.outline = '2px solid var(--accent)'; b.style.outlineOffset = '1px'; }
          else { b.style.outline = 'none'; }
        });
      }

      function applyCharacterPicked(playerIdPicked, charIdPicked){
        // If it's me, set my selection
        if (playerIdPicked === playerId){
          myCharId = charIdPicked;
          showToast('Picked: ' + charIdPicked);
        }
        takenChars.add(charIdPicked);
        markTaken([...takenChars]);
      }

      // --- Sending ---
      function sendReady(){
        if(!ws) return;
        if (!myCharId){ showToast('Pick a character first'); return; }
        myReady = true;
        setReadyPill(true);
        ws.send(JSON.stringify({ type:'PLAYER_READY', ts: Date.now() }));
        log('> PLAYER_READY');
      }

      function sendCharSelect(charId){
        if(!ws) return;
        ws.send(JSON.stringify({ type:'CHARACTER_SELECT', charId, ts: Date.now() }));
        log('> CHARACTER_SELECT ' + charId);
      }

      // --- Join flow ---
      $('btnJoin').onclick = async () => {
        roomId = $('room').value.trim().toUpperCase();
        const name = $('name').value.trim() || 'Player';
        if(!roomId){ alert('Enter room code.'); return; }

        try{
          const resp = await fetch(`${HTTP_BASE}/rooms/${roomId}/join`, { method:'POST' });
          if(!resp.ok){ log('Join HTTP failed: ' + resp.status); setStatus('Join failed'); return; }
          const j = await resp.json();
          playerId = j.playerId;
          log('Got playerId: ' + playerId);
        }catch(e){ log('HTTP error: ' + e); setStatus('HTTP error'); return; }

        ws = new WebSocket(WS_URL);
        ws.onopen = () => {
          log('WS open.');
          ws.send(JSON.stringify({ type:'HELLO_PLAYER', roomId, playerId, name }));
          setStatus('Connected. In Lobby.', true);
          setLobbyVisible(true);
          clearInterval(hbInterval);
          hbInterval = setInterval(()=> {
            try { ws.readyState===1 && ws.send(JSON.stringify({ type:'PING' })); } catch(_) {}
          }, 5000);
        };

        ws.onmessage = (ev) => {
          log('< ' + ev.data);
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'PONG') return;
            if (msg.type !== 'STATE') return;
            const s = msg.state || {};
            switch(s.type){
              // --- Lobby states ---
              case 'CHARACTER_CATALOG':
                ensureGrid();
                renderCatalog(s.entries||[]);
                break;

              case 'LOBBY_STATE':
                setStatus('Lobby: ' + ((s.players||[]).map(p => `${p.name}${p.ready?' ✅':''}${p.charId?(' · '+p.charId):''}`).join(', ') || '—'), true);
                markTaken(s.taken||[]);
                break;

              case 'CHARACTER_TAKEN':
                takenChars.add(s.charId);
                markTaken([...takenChars]);
                break;

              case 'CHARACTER_PICKED':
                applyCharacterPicked(s.playerId, s.charId);
                break;

              case 'READY_OPEN':
                // scene 2 uses host-controlled start; but we might still receive this from host tools
                showToast('Ready phase open');
                break;

              case 'READY_CLOSE':
                showToast('Ready closed');
                break;

              case 'LOBBY_LOCKED':
                setStatus('Game starting…', true);
                $('lobbyArea').classList.add('hidden');
                break;

              // --- Fallback text messages (e.g., host disconnects) ---
              case 'TEXT':
                showToast('📣 ' + (s.message || 'Info'));
                break;
            }
          } catch(e) {
            console.error(e);
          }
        };

        ws.onclose = () => {
          log('WS closed.');
          setStatus('Disconnected');
          setLobbyVisible(false);
          clearInterval(hbInterval);
        };
      };

      $('btnReady').onclick = sendReady;
    </script>
  </body>
</html>
