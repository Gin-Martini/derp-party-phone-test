<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Derp Party — Phone</title>
  <link rel="stylesheet" href="./css/styles.css?v=1.0.0">
</head>
<body>
  <header id="topbar">
    <div id="status">Disconnected</div>
  </header>

  <!-- JOIN -->
  <section id="join-card" class="card">
    <h1>Join Game</h1>
    <label>Room Code
      <input id="roomCode" placeholder="ABCDE" maxlength="6" autocomplete="off">
    </label>
    <label>Your Name
      <input id="playerName" placeholder="Name" maxlength="20" autocomplete="off">
    </label>
    <div class="row">
      <button id="btnJoin">Join</button>
      <button id="btnResume" class="secondary hidden">Resume</button>
    </div>
    <p class="hint">Server base can be overridden by URL: <code>?api=https://host</code> &amp; <code>?ws=wss://relay</code></p>
  </section>

  <!-- LOBBY -->
  <section id="lobby" class="card hidden">
    <h2>Choose Your Character</h2>
    <div id="catalogGrid" class="grid"></div>
    <div class="row">
      <button id="btnReady" disabled>I'm Ready</button>
    </div>
    <div id="lobbyInfo" class="note"></div>
  </section>

  <!-- ROLL OVERLAY -->
  <section id="rollOverlay" class="overlay hidden">
    <div class="overlay-card">
      <h2 id="rollLabel">Roll</h2>
      <div id="rollSub" class="note"></div>
      <button id="btnRoll">Tap to Roll</button>
      <div id="rollResults" class="results"></div>
      <button id="btnCloseRoll" class="secondary hidden">Close</button>
    </div>
  </section>

  <!-- GENERIC SCREEN -->
  <section id="screen" class="card hidden">
    <h2 id="screenTitle">Screen</h2>
    <div id="screenBody"></div>
  </section>

  <script type="module" src="./js/main.js?v=1.0.0"></script>
</body>
</html>
