<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Derp Party – Phone (Lobby)</title>
    <link rel="preload" href="./app.css?v=10.0.1" as="style">
    <link rel="stylesheet" href="./app.css?v=10.0.1">
  </head>
  <body>
    <div class="wrap">
      <h3>Derp Party – Phone</h3>

      <div class="card" id="joinCard">
        <label>Room Code</label>
        <input id="room" placeholder="e.g. ABC123" autocomplete="one-time-code">
        <label>Name</label>
        <input id="name" placeholder="Your name" value="Player">
        <div class="row" style="margin-top:10px">
          <button id="btnJoin" class="btn-primary" type="button">Join Room</button>
        </div>
      </div>

      <div id="status" class="pill">Status: Waiting to join…</div>

      <div id="lobbyArea" class="card hidden">
        <div class="row" style="align-items:center;justify-content:space-between">
          <div class="pill">Pick a character, then tap “I’m Ready”.</div>
          <div id="readyPill" class="pill no">Not Ready</div>
        </div>

        <div id="charGrid"></div>

        <div class="row" style="margin-top:10px">
          <button id="btnReady" class="btn-accent btn-disabled" disabled type="button">I’m Ready</button>
        </div>
      </div>

      <!-- TURN / ROLL OVERLAY -->
      <div id="turnOrder" class="card hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <div class="pill" id="rollTitle">Roll</div>
          <div id="rollState" class="pill no">Waiting…</div>
        </div>

        <div style="margin:12px 0;display:flex;flex-direction:column;gap:10px;align-items:center">
          <div id="rollValue" style="font-size:42px;line-height:1;font-weight:700;letter-spacing:.02em">—</div>
          <button id="btnRoll" class="btn-primary" type="button">Tap to Roll</button>
        </div>

        <div id="orderResult" class="hidden" style="margin-top:10px;font-size:14px;color:#c9d1d9"></div>
      </div>

      <pre id="log" class="hidden"></pre>
      <div id="toast"></div>
      <div id="dbg">last: —</div>
    </div>

   <script type="module" src="./js/main.js?v=11.0.4"></script>
  </body>
</html>
